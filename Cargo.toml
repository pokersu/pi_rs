[workspace]
resolver = "2"
members = [
    "crates/pi-telemetry",
    "crates/pi-ai",
    "crates/pi-agent-core",
    "crates/pi-durable",
    "crates/pi-tools",
    "crates/demo-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
futures = "0.3"
indexmap = { version = "2", features = ["serde"] }
jsonschema = "0.28"
libc = "0.2"
notify = "6"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "fs", "process", "io-util"] }
tokio-util = "0.7"
unicode-normalization = "0.1"
